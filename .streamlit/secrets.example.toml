# Copy to .streamlit/secrets.toml and fill in.

ADMIN_PASSWORD = "director"

# Milestone 3 — Seedance 2.0 on BytePlus ModelArk (AP-Southeast)
ARK_API_KEY = ""
ARK_MODEL_EP = ""  # your Ark inference endpoint ID, e.g. ep-2026...

# Real-human asset library (AK/SK signed APIs — needs Advanced Creation Rights)
ARK_AK = ""            # IAM access key ID (ArkFullAccess on the project)
ARK_SK = ""            # IAM secret access key
ARK_REGION = "ap-southeast-1"
ARK_PROJECT = "default"
# CallbackURL for the liveness H5 (result is polled, so this can be any page)
LIVENESS_CALLBACK_URL = "https://www.byteplus.com/en"

# BytePlus TOS (object storage) — hosts the captured portrait for CreateAsset
[tos]
bucket = ""
region = "ap-southeast-1"
endpoint = "tos-ap-southeast-1.bytepluses.com"
# TOS uses the same AK/SK as above unless overridden here
ak = ""
sk = ""

# Milestone 4 — premiere email delivery
[smtp]
host = "smtp.gmail.com"
port = 587
user = ""
app_password = ""
sender = "Premiere Pictures <no-reply@example.com>"
